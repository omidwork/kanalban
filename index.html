<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>مدیریت کانال ایتا</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📢 مدیریت کانال</h1>
            <div id="user-info"></div>
        </header>

        <nav class="menu">
            <button id="btn-channels" class="menu-btn">📡 کانال‌های من</button>
            <button id="btn-new-post" class="menu-btn">✏️ پیغام جدید</button>
            <button id="btn-schedule" class="menu-btn">⏰ صف ارسال</button>
            <button id="btn-stats" class="menu-btn">📊 آمار</button>
        </nav>

        <div id="main-panel">
            <div id="channels-list" class="panel hidden">
                <h3>کانال‌های دارای دسترسی</h3>
                <ul id="channels-ul"></ul>
            </div>

            <div id="new-post-panel" class="panel hidden">
                <h3>ارسال پیام جدید</h3>
                <select id="chat-select"></select>
                <textarea id="message-text" placeholder="متن پیام..."></textarea>
                <label><input type="checkbox" id="pin-message"> سنجاق کردن پیام</label>
                <button id="send-now">ارسال الآن</button>
                <div id="schedule-area">
                    <input type="datetime-local" id="schedule-time">
                    <button id="schedule-post">زمان‌بندی ارسال</button>
                </div>
            </div>

            <div id="schedule-panel" class="panel hidden">
                <h3>پست‌های زمان‌بندی شده</h3>
                <ul id="schedule-list"></ul>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
